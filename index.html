<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>농촌사회서비스</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="intro-wrap">
    <a class="intro-skip" href="#intro-main">본문 바로가기</a>
    <header class="intro-header">
      <h1 class="sr-only">농촌사회서비스</h1>
    </header>

    <main class="intro-main" id="intro-main" tabindex="-1">
      <div class="intro-inner intro-cards">
        <div class="intro-item">
          <div class="intro-logo">
            <img src="images/logo-farming.svg" alt="사회적농업">
          </div>
          <a class="intro-card social" href="https://www.socialfarm.kr/" aria-label="사회적농업 바로가기">
            <div class="intro-card-visual">
              <img class="intro-card-bg" src="images/intro-farming.png" alt="">
            </div>
            <div class="intro-copy">
              <h2 id="social-title">농업의 공익적 <span class="intro-title-line">역할을 통해</span></h2>
              <p>농업인과 사회적 약자를 포용하는<br>농촌 공동체 활성화를 도모합니다.</p>
            </div>
            <span class="intro-button" aria-hidden="true">
              바로가기
            </span>
          </a>
        </div>

        <div class="intro-item">
          <div class="intro-logo">
            <img src="images/logo-sharing.svg" alt="농촌재능나눔">
          </div>
          <a class="intro-card sharing" href="https://www.smilebank.kr/web/index.do" aria-label="농촌재능나눔 바로가기">
            <div class="intro-card-visual">
              <img class="intro-card-bg" src="images/intro-sharing.png" alt="">
            </div>
            <div class="intro-copy">
              <h2 id="sharing-title">농촌재능나눔</h2>
              <p>농촌마을을 이어주는 기능을 하는<br>인터넷 기반의 지원시스템</p>
            </div>
            <span class="intro-button" aria-hidden="true">
              바로가기
            </span>
          </a>
        </div>

        <div class="intro-item">
          <div class="intro-logo">
            <img src="images/logo-education.svg" alt="농촌경제사회서비스 교육훈련기관">
          </div>
          <a class="intro-card edu" href="https://socialfarmedu.kr/" aria-label="농촌경제사회서비스 교육훈련기관 바로가기">
            <div class="intro-card-visual">
              <img class="intro-card-bg" src="images/intro-education.png" alt="">
            </div>
            <div class="intro-copy">
              <h2 id="edu-title">농촌경제사회서비스<br>교육훈련기관</h2>
              <p>농촌경제사회서비스<br>전문교육을 선도하는 교육훈련기관</p>
            </div>
            <span class="intro-button" aria-hidden="true">
              바로가기
            </span>
          </a>
        </div>
      </div>
    </main>

    <footer class="intro-footer">
      <div class="intro-inner intro-footer-inner">
        <p>COPYRIGHT 2026. 농촌사회서비스. ALL RIGHTS RESERVED.</p>
        <div class="intro-partners">
          <a href="https://www.mafra.go.kr/sites/home/index.do"><img src="images/logo-mafra.png" alt="농림축산식품부"></a>
          <a href="https://www.ekr.or.kr/"><img src="images/logo-krc.png" alt="한국농어촌공사"></a>
          <a href="https://jthink.kr/"><img src="images/logo-jthink.png" alt="전북연구원"></a>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
